# nginx proxy address - http://172.17.0.1:59073

name: bytestash
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: ghcr.io/jordan-dalby/bytestash:latest
    container_name: bytestash-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      JWT_SECRET: ${APP_SECRET_KEY:-changeme_secret_key_min_32_chars}
      ALLOW_NEW_ACCOUNTS: ${BYTESTASH_ALLOW_REGISTRATION:-true}
      DISABLE_INTERNAL_ACCOUNTS: false
      TOKEN_EXPIRY: ${BYTESTASH_TOKEN_EXPIRY:-24h}
      DISABLE_ACCOUNTS: ${BYTESTASH_DISABLE_ACCOUNTS:-false}
      ALLOW_PASSWORD_CHANGES: true
      CONTAINER_NAME: bytestash-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    ports:
      - '172.17.0.1:59073:5000'
    volumes:
      - './volumes/data/bytestash:/data/snippets'
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:5000 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      - bytestash
      - proxy
      - cloudflare
    labels:
      - 'traefik.enable=true'
      - 'cloudflare.enable=true'
      - 'traefik.docker.network=proxy'
      - 'cloudflare.service=http://bytestash-app:5000'
      - 'cloudflare.hostname=bytestash.${CLOUDFLARE_ZONE_NAME:-}'
      - 'traefik.http.routers.bytestash-app.entrypoints=http'
      - 'traefik.http.routers.bytestash-app-secure.tls=true'
      - 'traefik.http.routers.bytestash-app.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.middlewares.bytestash-app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.bytestash-app.middlewares=bytestash-app-https-redirect'
      - 'traefik.http.routers.bytestash-app-secure.entrypoints=https'
      - 'traefik.http.routers.bytestash-app-secure.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.routers.bytestash-app-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.bytestash-app-secure.service=bytestash-app'
      - 'traefik.http.services.bytestash-app.loadbalancer.server.port=5000'

networks:
  bytestash:
    name: bytestash
    external: false
  proxy:
    external: true
  cloudflare:
    external: true
